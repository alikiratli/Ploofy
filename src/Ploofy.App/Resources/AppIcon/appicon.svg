<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Ploofy ikonunun zemini. Yalnızca düz dolgular ve daireler var: degrade,
     süzgeç ve yazı yok. Resizetizer bu dosyayı Android'de uyarlanabilir
     ikonun arka katmanına, iOS'ta ikonun tabanına dönüştürüyor; iki yolda
     da en sade SVG en güvenilir sonucu veriyor. Baloncuklar köşelerde
     duruyor çünkü uyarlanabilir ikon maskesi köşeleri kırpabiliyor —
     kırpılırsa kaybı olmayan tek şeyler onlar. -->
