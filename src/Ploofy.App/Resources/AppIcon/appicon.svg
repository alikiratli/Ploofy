    <rect x="0" y="0" width="456" height="456" fill="#FFD166" />

    <circle cx="74" cy="82" r="56" fill="#FFFFFF" opacity="0.20" />
    <circle cx="394" cy="112" r="38" fill="#FFFFFF" opacity="0.16" />
    <circle cx="372" cy="392" r="72" fill="#FFFFFF" opacity="0.13" />
    <circle cx="96" cy="386" r="30" fill="#FFFFFF" opacity="0.16" />
