<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Ploofy'nin yüzü: balon patlatmadan gelen mavi kabarcık.
     Bütün çizim merkezden 126 birim yarıçapın içinde kalıyor. Android'in
     uyarlanabilir ikonu ön katmanın dış üçte birini maskeyle kırpıyor; bu
     yarıçap (456'nın %55'i) her maske biçiminde tam görünüyor.
     Hacim degradeyle değil üst üste iki daireyle veriliyor: koyu daire
     altta bir milim taşıyor ve kenar gölgesi oluyor. Oyun yüzeylerinde de
     aynı yol izleniyor, bkz. PloofyPalette. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <circle cx="228" cy="234" r="126" fill="#0F6FC4" />
    <circle cx="228" cy="226" r="120" fill="#3FB5F5" />

    <ellipse cx="186" cy="172" rx="36" ry="25" fill="#FFFFFF" opacity="0.55"
             transform="rotate(-28 186 172)" />

    <!-- Yanaklar mavinin üstünde duruyor; saydam pembe mora kayıyordu.
         Koyu pembe ve yüksek örtme, karışan az miktar maviyle birlikte
         yine pembe kalıyor. -->
    <ellipse cx="168" cy="264" rx="18" ry="11" fill="#FF5C93" opacity="0.85" />
    <ellipse cx="288" cy="264" rx="18" ry="11" fill="#FF5C93" opacity="0.85" />

    <circle cx="196" cy="216" r="16" fill="#3A2A1E" />
    <circle cx="260" cy="216" r="16" fill="#3A2A1E" />
    <circle cx="201" cy="210" r="5" fill="#FFFFFF" />
    <circle cx="265" cy="210" r="5" fill="#FFFFFF" />

    <path d="M 194 258 Q 228 292 262 258" fill="none" stroke="#3A2A1E"
          stroke-width="15" stroke-linecap="round" />
</svg>
